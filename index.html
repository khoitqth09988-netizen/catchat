<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Online Realtime - Có Đăng Nhập</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #121212; color: #ffffff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 15px; }
        
        /* Form Auth */
        .auth-container { width: 100%; max-width: 400px; background: #1e1e1e; padding: 25px; border-radius: 12px; border: 1px solid #333; box-shadow: 0 8px 24px rgba(0,0,0,0.5); text-align: center; }
        .auth-container h2 { margin-bottom: 20px; color: #4facfe; }
        .auth-container input { width: 100%; padding: 12px; margin-bottom: 12px; background: #2a2a2a; border: 1px solid #444; color: #fff; border-radius: 6px; outline: none; }
        .auth-container button { width: 100%; padding: 12px; background: linear-gradient(135deg, #00f2fe, #4facfe); border: none; color: #fff; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 5px; }
        .auth-container p { margin-top: 15px; font-size: 0.85rem; color: #aaa; cursor: pointer; }
        .auth-container p span { color: #00f2fe; text-decoration: underline; }

        /* Giao diện Chat */
        .chat-container { width: 100%; max-width: 500px; background: #1e1e1e; border-radius: 12px; overflow: hidden; box-shadow: 0 8px 24px rgba(0,0,0,0.5); border: 1px solid #333; display: none; flex-direction: column; height: 80vh; }
        .chat-header { background: #252525; padding: 12px 20px; border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center; }
        .chat-header .user-info { font-size: 0.9rem; color: #4facfe; font-weight: bold; }
        .chat-header button { background: #ff4757; padding: 6px 12px; font-size: 0.8rem; border-radius: 4px; border: none; color: #fff; cursor: pointer; font-weight: bold; }
        
        .chat-messages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .message-item { background: #2a2a2a; padding: 10px 14px; border-radius: 8px; max-width: 80%; word-break: break-word; }
        .message-item.my-msg { align-self: flex-end; background: #1e3c72; }
        .message-item .user { font-size: 0.75rem; color: #00f2fe; margin-bottom: 3px; font-weight: 600; }
        .message-item .text { font-size: 0.95rem; }

        .chat-input-area { display: flex; padding: 12px; background: #252525; gap: 8px; border-top: 1px solid #333; }
        .chat-input-area input { flex: 1; background: #181818; border: 1px solid #444; color: #fff; padding: 10px 12px; border-radius: 6px; outline: none; }
        .chat-input-area button { background: linear-gradient(135deg, #00f2fe, #4facfe); border: none; color: #fff; padding: 10px 18px; border-radius: 6px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<!-- Form Đăng ký / Đăng nhập -->
<div class="auth-container" id="authBox">
    <h2 id="authTitle">Đăng Nhập</h2>
    <input type="text" id="displayName" placeholder="Tên hiển thị (Biệt danh)" style="display: none;">
    <input type="email" id="email" placeholder="Email của bạn...">
    <input type="password" id="password" placeholder="Mật khẩu (ít nhất 6 ký tự)...">
    <button id="authBtn" onclick="handleAuth()">Đăng Nhập</button>
    <p id="toggleAuth" onclick="switchAuthMode()">Chưa có tài khoản? <span>Đăng ký ngay</span></p>
</div>

<!-- Khung Chat -->
<div class="chat-container" id="chatBoxContainer">
    <div class="chat-header">
        <span class="user-info" id="currentUserDisplay">👋 Xin chào</span>
        <button onclick="logout()">Đăng xuất</button>
    </div>
    <div class="chat-messages" id="chatBox"></div>
    <div class="chat-input-area">
        <input type="text" id="message" placeholder="Nhập tin nhắn..." onkeydown="if(event.key === 'Enter') sendMessage()">
        <button onclick="sendMessage()">Gửi</button>
    </div>
</div>

<!-- Firebase Compat SDK -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAf8xiMmAipgxxrGVDjeLdQIeU1yqVEXu0",
        authDomain: "chat-e58b5.firebaseapp.com",
        databaseURL: "https://chat-e58b5-default-rtdb.firebaseio.com",
        projectId: "chat-e58b5",
        storageBucket: "chat-e58b5.firebasestorage.app",
        messagingSenderId: "723561612208",
        appId: "1:723561612208:web:03f38d2ac4b85e59e18c75"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const database = firebase.database();
    const messagesRef = database.ref("messages");

    let isSignUp = false;
    let currentUser = null;

    // Chuyển đổi giữa Đăng ký và Đăng nhập
    function switchAuthMode() {
        isSignUp = !isSignUp;
        document.getElementById("authTitle").textContent = isSignUp ? "Đăng Ký Tài Khoản" : "Đăng Nhập";
        document.getElementById("displayName").style.display = isSignUp ? "block" : "none";
        document.getElementById("authBtn").textContent = isSignUp ? "Tạo Tài Khoản" : "Đăng Nhập";
        document.getElementById("toggleAuth").innerHTML = isSignUp 
            ? "Đã có tài khoản? <span>Đăng nhập</span>" 
            : "Chưa có tài khoản? <span>Đăng ký ngay</span>";
    }

    // Xử lý Xác thực
    function handleAuth() {
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value.trim();
        const displayName = document.getElementById("displayName").value.trim();

        if (!email || !password) {
            alert("Vui lòng điền đầy đủ Email và Mật khẩu!");
            return;
        }

        if (isSignUp) {
            if (!displayName) { alert("Vui lòng nhập Biệt danh!"); return; }
            auth.createUserWithEmailAndPassword(email, password)
                .then((userCredential) => {
                    return userCredential.user.updateProfile({ displayName: displayName });
                })
                .catch((err) => alert("Lỗi đăng ký: " + err.message));
        } else {
            auth.signInWithEmailAndPassword(email, password)
                .catch((err) => alert("Lỗi đăng nhập: " + err.message));
        }
    }

    // Lắng nghe trạng thái Đăng nhập
    auth.onAuthStateChanged((user) => {
        if (user) {
            currentUser = user;
            document.getElementById("authBox").style.display = "none";
            document.getElementById("chatBoxContainer").style.display = "flex";
            document.getElementById("currentUserDisplay").textContent = "👤 " + (user.displayName || user.email);
            loadMessages();
        } else {
            currentUser = null;
            document.getElementById("authBox").style.display = "block";
            document.getElementById("chatBoxContainer").style.display = "none";
            document.getElementById("chatBox").innerHTML = "";
        }
    });

    // Đăng xuất
    function logout() {
        auth.signOut();
    }

    // Gửi tin nhắn
    function sendMessage() {
        const messageInput = document.getElementById("message");
        const text = messageInput.value.trim();

        if (text !== "" && currentUser) {
            messagesRef.push({
                uid: currentUser.uid,
                name: currentUser.displayName || currentUser.email.split('@')[0],
                text: text,
                timestamp: Date.now()
            });
            messageInput.value = "";
        }
    }

    // Lắng nghe tin nhắn
    function loadMessages() {
        messagesRef.off(); // Reset listener cũ
        messagesRef.limitToLast(50).on("child_added", (snapshot) => {
            const data = snapshot.val();
            
            const msgDiv = document.createElement("div");
            msgDiv.className = "message-item" + (data.uid === currentUser.uid ? " my-msg" : "");
            
            const userDiv = document.createElement("div");
            userDiv.className = "user";
            userDiv.textContent = data.name;

            const textDiv = document.createElement("div");
            textDiv.className = "text";
            textDiv.textContent = data.text;

            msgDiv.appendChild(userDiv);
            msgDiv.appendChild(textDiv);
            const chatBox = document.getElementById("chatBox");
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        });
    }
</script>

</body>
</html>
