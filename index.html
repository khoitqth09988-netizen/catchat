<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Online Realtime</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
            height: 100vh;
            height: 100dvh;
        }

        /* Glassmorphism scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.6);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(99, 102, 241, 0.4);
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(99, 102, 241, 0.7);
        }

        /* Glass effect container */
        .glass-panel {
            background: rgba(30, 41, 59, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .glass-input {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .glass-input:focus {
            border-color: rgba(99, 102, 241, 0.6);
            box-shadow: 0 0 15px rgba(99, 102, 241, 0.2);
        }

        /* Custom bubble animation */
        @keyframes popIn {
            0% { opacity: 0; transform: translateY(10px) scale(0.98); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        .message-anim {
            animation: popIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* Pulse glow for status */
        .status-pulse {
            box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7);
            animation: pulse-green 2s infinite;
        }

        @keyframes pulse-green {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(34, 197, 94, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
        }
    </style>
</head>
<body class="flex items-center justify-center p-2 sm:p-4 text-slate-100 overflow-hidden">

    <!-- Chat Main Wrapper -->
    <div class="glass-panel w-full max-w-4xl h-[96vh] sm:h-[90vh] rounded-2xl flex flex-col shadow-2xl overflow-hidden relative">

        <!-- Header -->
        <header class="flex items-center justify-between px-4 sm:px-6 py-3.5 border-b border-slate-700/50 bg-slate-900/40">
            <div class="flex items-center gap-3">
                <div class="relative">
                    <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-indigo-500 to-purple-500 flex items-center justify-center font-bold text-white shadow-lg shadow-indigo-500/30">
                        <i class="fa-solid fa-comments text-lg"></i>
                    </div>
                    <span class="absolute bottom-0 right-0 w-3 h-3 bg-emerald-500 rounded-full border-2 border-slate-900 status-pulse"></span>
                </div>
                <div>
                    <h1 class="font-bold text-base sm:text-lg tracking-wide text-white flex items-center gap-2">
                        Phòng Chat Sôi Động
                        <span class="text-xs font-normal px-2 py-0.5 rounded-full bg-indigo-500/20 text-indigo-300 border border-indigo-500/30">Global</span>
                    </h1>
                    <div class="flex items-center gap-2 text-xs text-slate-400">
                        <span id="connection-status" class="text-emerald-400 flex items-center gap-1">
                            <i class="fa-solid fa-circle text-[8px]"></i> Đã kết nối
                        </span>
                        <span>•</span>
                        <span id="user-display-name" class="font-medium text-slate-300">Biệt danh: Anonymous</span>
                    </div>
                </div>
            </div>

            <!-- Action buttons -->
            <div class="flex items-center gap-2">
                <button onclick="toggleSettingsModal()" title="Cấu hình biệt danh" class="p-2.5 rounded-xl text-slate-300 hover:text-white hover:bg-slate-800/60 transition-all border border-transparent hover:border-slate-700 active:scale-95">
                    <i class="fa-solid fa-user-pen text-base"></i>
                </button>
            </div>
        </header>

        <!-- Messages Area -->
        <main id="chat-messages" class="flex-1 overflow-y-auto p-4 sm:p-6 space-y-4 relative bg-slate-950/20">
            
            <!-- Connection Loader (Hidden when loaded) -->
            <div id="loading-spinner" class="absolute inset-0 flex flex-col items-center justify-center bg-slate-900/60 backdrop-blur-sm z-10 transition-opacity duration-300">
                <div class="w-10 h-10 border-3 border-indigo-500/20 border-t-indigo-500 rounded-full animate-spin mb-3"></div>
                <p class="text-sm text-slate-400 font-medium">Đang kết nối Realtime Database...</p>
            </div>

            <!-- System Welcome Message -->
            <div class="flex justify-center my-2">
                <div class="bg-slate-800/40 border border-slate-700/50 rounded-full px-4 py-1.5 text-xs text-slate-400 flex items-center gap-2 shadow-sm">
                    <i class="fa-solid fa-shield-halved text-indigo-400"></i>
                    Chào mừng bạn đến với phòng chat! Hãy tôn trọng những người dùng khác.
                </div>
            </div>

        </main>

        <!-- Emoji Bar Picker Popup -->
        <div id="emoji-picker" class="hidden absolute bottom-20 left-4 sm:left-6 bg-slate-800/95 border border-slate-700/80 backdrop-blur-md p-3 rounded-2xl shadow-2xl z-20 transition-all duration-200 w-72 sm:w-80">
            <div class="text-xs font-semibold text-slate-400 mb-2 px-1 flex justify-between items-center">
                <span>Biểu cảm nhanh</span>
                <button onclick="toggleEmojiPicker()" class="text-slate-500 hover:text-slate-300"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="grid grid-cols-6 gap-2 text-xl max-h-40 overflow-y-auto p-1">
                <button onclick="appendEmoji('😊')" class="hover:bg-slate-700/60 p-1.5 rounded-lg transition-transform active:scale-125">😊</button>
                <button onclick="appendEmoji('😂')" class="hover:bg-slate-700/60 p-1.5 rounded-lg transition-transform active:scale-125">😂</button>
                <button onclick="appendEmoji('🤣')" class="hover:bg-slate-700/60 p-1.5 rounded-lg transition-transform active:scale-125">🤣</button>
                <button onclick="appendEmoji('😍')" class="hover:bg-slate-700/60 p-1.5 rounded-lg transition-transform active:scale-125">😍</button>
                <button onclick="appendEmoji('👍')" class="hover:bg-slate-700/60 p-1.5 rounded-lg transition-transform active:scale-125">👍</button>
                <button onclick="appendEmoji('🔥')" class="hover:bg-slate-700/60 p-1.5 rounded-lg transition-transform active:scale-125">🔥</button>
                <button onclick="appendEmoji('❤️')" class="hover:bg-slate-700/60 p-1.5 rounded-lg transition-transform active:scale-125">❤️</button>
                <button onclick="appendEmoji('🎉')" class="hover:bg-slate-700/60 p-1.5 rounded-lg transition-transform active:scale-125">🎉</button>
                <button onclick="appendEmoji('😎')" class="hover:bg-slate-700/60 p-1.5 rounded-lg transition-transform active:scale-125">😎</button>
                <button onclick="appendEmoji('😭')" class="hover:bg-slate-700/60 p-1.5 rounded-lg transition-transform active:scale-125">😭</button>
                <button onclick="appendEmoji('🤔')" class="hover:bg-slate-700/60 p-1.5 rounded-lg transition-transform active:scale-125">🤔</button>
                <button onclick="appendEmoji('💩')" class="hover:bg-slate-700/60 p-1.5 rounded-lg transition-transform active:scale-125">💩</button>
            </div>
        </div>

        <!-- Message Input Bar -->
        <footer class="p-3 sm:p-4 border-t border-slate-700/50 bg-slate-900/60 relative">
            <form id="chat-form" onsubmit="handleSendMessage(event)" class="flex items-center gap-2">
                <button type="button" onclick="toggleEmojiPicker()" class="p-3 text-slate-400 hover:text-amber-400 hover:bg-slate-800/80 rounded-xl transition-all border border-transparent hover:border-slate-700">
                    <i class="fa-solid fa-face-smile text-lg"></i>
                </button>
                
                <input 
                    type="text" 
                    id="message-input" 
                    placeholder="Nhập tin nhắn của bạn..." 
                    autocomplete="off"
                    class="glass-input flex-1 py-3 px-4 rounded-xl text-slate-100 placeholder-slate-500 text-sm focus:outline-none transition-all"
                >

                <button 
                    type="submit" 
                    class="bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 text-white font-medium px-5 py-3 rounded-xl shadow-lg shadow-indigo-600/30 hover:shadow-indigo-500/50 transition-all flex items-center justify-center gap-2 active:scale-95 disabled:opacity-50"
                >
                    <span class="hidden sm:inline text-sm font-semibold">Gửi</span>
                    <i class="fa-solid fa-paper-plane text-sm"></i>
                </button>
            </form>
        </footer>

    </div>

    <!-- Settings / Change Nickname Modal -->
    <div id="settings-modal" class="hidden fixed inset-0 bg-slate-950/70 backdrop-blur-md flex items-center justify-center p-4 z-50">
        <div class="glass-panel w-full max-w-md rounded-2xl p-6 shadow-2xl border border-slate-700/80">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-bold text-white flex items-center gap-2">
                    <i class="fa-solid fa-user-gear text-indigo-400"></i> Đổi biệt danh
                </h3>
                <button onclick="toggleSettingsModal()" class="text-slate-400 hover:text-white">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            <p class="text-xs text-slate-400 mb-4">Biệt danh này sẽ hiển thị kèm theo tin nhắn của bạn trong phòng chat.</p>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1.5">Tên biệt danh mới</label>
                    <input 
                        type="text" 
                        id="nickname-input" 
                        maxlength="25"
                        placeholder="Ví dụ: Anh_Khởi_Pro" 
                        class="glass-input w-full py-2.5 px-3.5 rounded-xl text-slate-100 placeholder-slate-500 text-sm focus:outline-none"
                    >
                </div>
                <div class="flex justify-end gap-2 pt-2">
                    <button type="button" onclick="toggleSettingsModal()" class="px-4 py-2 rounded-xl text-xs font-medium text-slate-300 hover:bg-slate-800 transition-all">
                        Hủy
                    </button>
                    <button type="button" onclick="saveNickname()" class="px-4 py-2 rounded-xl text-xs font-semibold bg-indigo-600 hover:bg-indigo-500 text-white shadow-md shadow-indigo-600/30 transition-all">
                        Lưu lại
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase Compat SDKs (9.23.0) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <script>
        // 1. Cấu hình Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyAf8xiMmAipgxxrGVDjeLdQIeU1yqVEXu0",
            authDomain: "chat-e58b5.firebaseapp.com",
            databaseURL: "https://chat-e58b5-default-rtdb.firebaseio.com",
            projectId: "chat-e58b5",
            storageBucket: "chat-e58b5.firebasestorage.app",
            messagingSenderId: "723561612208",
            appId: "1:723561612208:web:03f38d2ac4b85e59e18c75"
        };

        // Khởi tạo Firebase
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        const messagesRef = database.ref("messages");

        // 2. Định danh người dùng (Lưu vết bằng LocalStorage hoặc tạo UID)
        let userId = localStorage.getItem("chat_user_id");
        if (!userId) {
            userId = "usr_" + Math.random().toString(36).substring(2, 9);
            localStorage.setItem("chat_user_id", userId);
        }

        let username = localStorage.getItem("chat_username");
        if (!username) {
            username = "Thành viên " + Math.floor(1000 + Math.random() * 9000);
            localStorage.setItem("chat_username", username);
        }

        // Cập nhật giao diện ban đầu
        document.getElementById("user-display-name").innerText = `Biệt danh: ${username}`;
        document.getElementById("nickname-input").value = username;

        // 3. Xử lý UI Modals & Elements
        const chatMessages = document.getElementById("chat-messages");
        const messageInput = document.getElementById("message-input");
        const loadingSpinner = document.getElementById("loading-spinner");
        const emojiPicker = document.getElementById("emoji-picker");
        const settingsModal = document.getElementById("settings-modal");

        function toggleEmojiPicker() {
            emojiPicker.classList.toggle("hidden");
        }

        function appendEmoji(emoji) {
            messageInput.value += emoji;
            messageInput.focus();
        }

        function toggleSettingsModal() {
            settingsModal.classList.toggle("hidden");
            if (!settingsModal.classList.contains("hidden")) {
                document.getElementById("nickname-input").focus();
            }
        }

        function saveNickname() {
            const inputVal = document.getElementById("nickname-input").value.trim();
            if (inputVal) {
                username = inputVal;
                localStorage.setItem("chat_username", username);
                document.getElementById("user-display-name").innerText = `Biệt danh: ${username}`;
                toggleSettingsModal();
            }
        }

        // Format thời gian (VD: 10:15 PM)
        function formatTime(timestamp) {
            if (!timestamp) return "";
            const date = new Date(timestamp);
            return date.toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' });
        }

        // Escaping HTML để phòng chống XSS attack
        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }

        // 4. Gửi tin nhắn lên Firebase
        function handleSendMessage(event) {
            event.preventDefault();
            const text = messageInput.value.trim();

            if (text !== "") {
                messagesRef.push({
                    senderId: userId,
                    name: username,
                    text: text,
                    timestamp: firebase.database.ServerValue.TIMESTAMP
                }).then(() => {
                    messageInput.value = "";
                    emojiPicker.classList.add("hidden");
                    messageInput.focus();
                }).catch(error => {
                    console.error("Lỗi gửi tin nhắn:", error);
                    alert("Không thể gửi tin nhắn. Vui lòng kiểm tra lại kết nối mạng!");
                });
            }
        }

        // 5. Lắng nghe dữ liệu Realtime từ Firebase
        let isFirstLoad = true;

        // Tải 100 tin nhắn gần nhất
        messagesRef.limitToLast(100).on("child_added", (snapshot) => {
            const data = snapshot.val();
            if (!data) return;

            // Ẩn loader khi tin nhắn đầu tiên tải về
            if (isFirstLoad) {
                loadingSpinner.classList.add("opacity-0");
                setTimeout(() => loadingSpinner.classList.add("hidden"), 300);
                isFirstLoad = false;
            }

            renderMessage(data);
        });

        // Ẩn spinner nếu kết nối thành công nhưng phòng chat trống
        messagesRef.once("value", () => {
            if (isFirstLoad) {
                loadingSpinner.classList.add("opacity-0");
                setTimeout(() => loadingSpinner.classList.add("hidden"), 300);
                isFirstLoad = false;
            }
        });

        // Hàm dựng thẻ Tin nhắn HTML
        function renderMessage(data) {
            const isMe = data.senderId === userId;
            const timeStr = formatTime(data.timestamp);

            const msgContainer = document.createElement("div");
            msgContainer.className = `flex flex-col ${isMe ? 'items-end' : 'items-start'} message-anim`;

            if (isMe) {
                // Tin nhắn của bản thân (Căn phải - Tông màu Indigo nổi bật)
                msgContainer.innerHTML = `
                    <div class="flex items-center gap-1.5 mb-1 text-[11px] text-slate-400 px-1">
                        <span class="text-slate-500">${timeStr}</span>
                        <span class="font-semibold text-indigo-300">Tôi</span>
                    </div>
                    <div class="max-w-[85%] sm:max-w-[70%] bg-gradient-to-r from-indigo-600 to-violet-600 text-white p-3.5 rounded-2xl rounded-tr-none shadow-md shadow-indigo-950/40 text-sm leading-relaxed break-words">
                        ${escapeHTML(data.text)}
                    </div>
                `;
            } else {
                // Tin nhắn của người khác (Căn trái - Tông màu xám Slate)
                msgContainer.innerHTML = `
                    <div class="flex items-center gap-1.5 mb-1 text-[11px] text-slate-400 px-1">
                        <span class="font-semibold text-slate-300">${escapeHTML(data.name || 'Người dùng')}</span>
                        <span class="text-slate-500">• ${timeStr}</span>
                    </div>
                    <div class="max-w-[85%] sm:max-w-[70%] bg-slate-800/90 text-slate-100 border border-slate-700/60 p-3.5 rounded-2xl rounded-tl-none shadow-md text-sm leading-relaxed break-words">
                        ${escapeHTML(data.text)}
                    </div>
                `;
            }

            chatMessages.appendChild(msgContainer);

            // Tự động cuộn xuống cuối
            chatMessages.scrollTo({
                top: chatMessages.scrollHeight,
                behavior: 'smooth'
            });
        }

        // Đóng các popup khi nhấp ra ngoài
        document.addEventListener('click', (e) => {
            if (!emojiPicker.contains(e.target) && !e.target.closest('button[onclick="toggleEmojiPicker()"]')) {
                emojiPicker.classList.add('hidden');
            }
        });
    </script>
</body>
</html>
